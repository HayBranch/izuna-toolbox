# 打 tag（v*）时发布
v*:
  tag_push:
    - name: publish-tauri
      # 在 Linux 容器中构建 Tauri 需要先补齐 GTK/WebKit 系统库。
      docker:
        image: node:20-bookworm
      env:
        # Rust / Tauri 缓存目录（可选）
        CARGO_HOME: /workspace/.cargo
        RUSTUP_HOME: /workspace/.rustup
      stages:
        - name: install frontend dependencies
          script: |
            apt-get update
            apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              build-essential \
              pkg-config \
              libgtk-3-dev \
              librsvg2-dev \
              libayatana-appindicator3-dev
            npm ci

        - name: install Rust stable
          script: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            . "$CARGO_HOME/env"
            rustc -V
            cargo -V

        - name: build the app
          script: |
            . "$CARGO_HOME/env"
            npm run tauri build
          # 说明：tauri-action 属于 GitHub 专属 Action，CNB 无对应插件，
          # 此处改为直接调用 tauri CLI 构建；发布动作由后续 git:release 与附件上传插件承担

        # 当前 CNB 构建节点是 Linux，Tauri 只能产出 Linux 二进制；
        # 便携包面向 Windows，需先把 Rust 目标切到 windows-x64-gnu 并构建 exe。
        - name: prepare windows portable exe
          script: |
            . "$CARGO_HOME/env"
            rustup target add x86_64-pc-windows-gnu
            apt-get update
            apt-get install -y --no-install-recommends mingw-w64 zip
            npm run tauri build -- --target x86_64-pc-windows-gnu --no-bundle

        - name: package portable zip
          script: |
            cp src-tauri/target/x86_64-pc-windows-gnu/release/izuna-toolbox.exe \
              src-tauri/target/release/izuna-toolbox.exe
            node scripts/package-portable.mjs

        # CNB 没有 cnb:artifact / cnb:release 内置任务：
        # Release 用 git:release 创建，附件用 cnbcool/attachments 插件上传。
        - name: create release
          type: git:release
          options:
            tag: $CNB_BRANCH
            title: "Izuna Toolbox $CNB_BRANCH"
            description: "See the assets to download."
            preRelease: false

        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - dist-portable/*.zip
              - src-tauri/target/release/bundle/nsis/*.exe

# 手动触发（等价 workflow_dispatch）：只产出制品，不创建 Release
$:
  web_trigger_publish:
    - name: publish-tauri-manual
      docker:
        image: node:20-bookworm
      stages:
        - name: install frontend dependencies
          script: |
            apt-get update
            apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              build-essential \
              pkg-config \
              libgtk-3-dev \
              librsvg2-dev \
              libayatana-appindicator3-dev
            npm ci

        - name: install Rust stable
          script: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            . "$CARGO_HOME/env"
            rustc -V

        - name: build the app
          script: |
            . "$CARGO_HOME/env"
            npm run tauri build

        # 当前 CNB 构建节点是 Linux，Tauri 只能产出 Linux 二进制；
        # 便携包面向 Windows，需先把 Rust 目标切到 windows-x64-gnu 并构建 exe。
        - name: prepare windows portable exe
          script: |
            . "$CARGO_HOME/env"
            rustup target add x86_64-pc-windows-gnu
            apt-get update
            apt-get install -y --no-install-recommends mingw-w64 zip
            npm run tauri build -- --target x86_64-pc-windows-gnu --no-bundle

        - name: package portable zip
          script: |
            cp src-tauri/target/x86_64-pc-windows-gnu/release/izuna-toolbox.exe \
              src-tauri/target/release/izuna-toolbox.exe
            node scripts/package-portable.mjs

        # 手动触发不创建 Release，制品作为 commit 附件保留。
        - name: upload build artifacts
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist-portable/*.zip
              - src-tauri/target/release/bundle/nsis/*.exe
