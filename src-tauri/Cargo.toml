[package]
name = "izuna-toolbox"
# 占位：应用版本号唯一来源是根目录 package.json
# （src-tauri/tauri.conf.json 的 version 指向它，安装包与前端都跟随）
version = "0.0.0"
description = "泉奈工具箱：OBS 可捕获的悬浮字幕桌面工具"
authors = ["you"]
edition = "2021"

[lib]
# 库形式组织逻辑，main.rs 只做入口；`staticlib`/`cdylib` 为将来编译移动端留口
name = "izuna_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 刻意保持依赖最小化（体积优先）：
# - 只保留托盘需要的 tray-icon 特性与必需的 single-instance（防止重复启动）；
# - rusqlite 的 `bundled` 特性把 SQLite 源码静态编译进程序，用户无需安装。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
tauri-plugin-single-instance = "2"

# 自动更新只在 Windows 实现（应用只发布 Windows 版）。
# gate 到 cfg(windows)：Linux 原生构建（CNB）完全不编译这些依赖，也就不需要
# OpenSSL；windows-gnu 交叉编译只会带上 native-tls→schannel（纯 Rust，无 C 代码）。
# reqwest 默认特性已含 default-tls(native-tls) + system-proxy(尊重系统代理) + http2。
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
