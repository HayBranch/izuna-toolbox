version: "1.0"
name: tauri-build-release
displayName: Tauri 构建发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: _1
    displayName: Tauri 构建
    nodeVersion: 20.18.0          # Node 26 不存在，改成稳定版 20
    commands:
    - npm config set registry https://registry.npmmirror.com
    # Tauri 2 Linux 打包必需的系统库，缺了 tauri build 直接挂
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - npm install
    - npm run tauri build          # Tauri 打包命令，不是 npm run bundle
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./src-tauri/target/release/bundle   # 产物在这里，不是 ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.cargo"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: _2
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: _3
    displayName: 发布
    dependArtifact: output
    version: 1.0.0.0
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true