name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest  # 直接指定在 Windows 环境下运行

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # tauri-action 会顺便构建 release exe，便携包直接复用这个 exe，不必再编译一次
      - name: install frontend dependencies
        run: npm ci

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 只有打 tag 时才创建 Release；手动运行时只产出 Actions Artifact
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Izuna Toolbox {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets to download.'
          # releaseDraft: true # 是否草稿
          prerelease: false

      - name: package portable zip
        run: node scripts/package-portable.mjs

      - name: upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: izuna-toolbox-portable
          path: dist-portable/*.zip
          if-no-files-found: error

      - name: upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: izuna-toolbox-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload portable to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -Path dist-portable -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'portable zip 未生成' }
          gh release upload "${{ github.ref_name }}" $zip.FullName --clobber

      # ---- MSI（best effort，绝不影响上面的 NSIS 主发布）----
      # WiX v3 在 GitHub Windows runner 上常因 light.exe 被 Defender 拦截而失败、
      # 且工具链已归档，因此单独、可失败地尝试：成功就把 .msi 一并上传，
      # 失败也只是没有 msi，NSIS 安装包 / 便携包 / Release 都照常产出。
      # bundle.targets 仍是 ["nsis"]，这里用 --bundles 覆盖，只打 msi。
      - name: build msi (best effort)
        continue-on-error: true
        run: npx tauri build --bundles msi

      - name: upload msi artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: izuna-toolbox-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: upload msi to release (best effort)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            Write-Host '未生成 MSI（WiX 在 runner 上可能失败），跳过上传；NSIS 主发布不受影响。'
            exit 0
          }
          gh release upload "${{ github.ref_name }}" $msi.FullName --clobber
