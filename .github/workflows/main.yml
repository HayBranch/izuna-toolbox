name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest  # 直接指定在 Windows 环境下运行

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # tauri-action 会顺便构建 release exe，便携包直接复用这个 exe，不必再编译一次
      - name: install frontend dependencies
        run: npm ci

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 只有打 tag 时才创建 Release；手动运行时只产出 Actions Artifact
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Izuna Toolbox {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets to download.'
          releaseDraft: true
          prerelease: false

      - name: package portable zip
        run: node scripts/package-portable.mjs

      - name: upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: izuna-toolbox-portable
          path: dist-portable/*.zip
          if-no-files-found: error

      - name: upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: izuna-toolbox-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload portable to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -Path dist-portable -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'portable zip 未生成' }
          gh release upload "${{ github.ref_name }}" $zip.FullName --clobber
